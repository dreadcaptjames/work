<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AV Design Sketch</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="AV Sketch">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0f1419">
<style>
:root{--bg:#0f1419;--panel:#1a2129;--line:#2c3742;--text:#e6edf3;--mute:#8b98a5;--acc:#4fb3ff;--acc2:#ffb454;--ok:#7bd88f;--bad:#ff6b6b}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--text);line-height:1.45}
header{display:flex;align-items:center;justify-content:space-between;gap:1rem;padding:.9rem 1.2rem;border-bottom:1px solid var(--line);flex-wrap:wrap}
header h1{font-size:1.1rem;margin:0;letter-spacing:.04em}
header h1 span{color:var(--acc)}
.tools button{margin-left:.3rem}
main{max-width:1100px;margin:0 auto;padding:1rem}
.steps{display:flex;gap:.3rem;flex-wrap:wrap;margin-bottom:1rem}
.steps button{background:var(--panel);border:1px solid var(--line);color:var(--mute);padding:.4rem .7rem;border-radius:999px;font-size:.82rem;cursor:pointer}
.steps button.on{border-color:var(--acc);color:var(--text)}
.steps button.done{color:var(--ok)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:1.2rem;margin-bottom:1rem}
.card h2{margin:0 0 .2rem;font-size:1.2rem}
.card .q{color:var(--mute);margin:0 0 1rem}
label{display:block;font-size:.82rem;color:var(--mute);margin:.6rem 0 .25rem}
input,select,textarea{width:100%;background:var(--field);border:1px solid var(--line);color:var(--text);padding:.5rem .6rem;border-radius:6px;font:inherit}
textarea{min-height:70px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:.2rem .8rem}
.item{border:1px solid var(--line);border-radius:8px;padding:.6rem .8rem;margin:.6rem 0;position:relative}
.item .x{position:absolute;top:.4rem;right:.5rem}
button{background:var(--btn);color:var(--text);border:1px solid var(--line);padding:.45rem .8rem;border-radius:6px;cursor:pointer;font:inherit;font-size:.88rem}
button:hover{border-color:var(--acc)}
button.pri{background:var(--acc);color:var(--onacc);border-color:var(--acc);font-weight:600}
button.sm{padding:.2rem .5rem;font-size:.78rem}
.nav{display:flex;justify-content:space-between;margin-top:1rem}
.chk{display:flex;align-items:center;gap:.4rem;color:var(--text);font-size:.9rem;margin:.3rem 0}
.chk input{width:auto}
table{width:100%;border-collapse:collapse;font-size:.88rem}
th,td{border-bottom:1px solid var(--line);padding:.4rem;text-align:left}
th{color:var(--mute);font-weight:500}
td.c,th.c{text-align:center}
.note{background:var(--accbg);border-left:3px solid var(--acc);padding:.5rem .8rem;margin:.5rem 0;font-size:.88rem;border-radius:0 6px 6px 0}
.note.warn{border-color:var(--acc2)}
.diagram{overflow-x:auto;background:var(--field);border-radius:8px;padding:.5rem}
.tag{display:inline-block;background:var(--btn);border-radius:4px;padding:0 .4rem;font-size:.75rem;margin-left:.3rem;color:var(--mute)}
@media print{
  body{background:#fff;color:#000}
  header .tools,.steps,.nav,.noprint{display:none!important}
  .card{border:1px solid #ccc;background:#fff;break-inside:avoid}
  .diagram{background:#fff}
}
body{padding-left:env(safe-area-inset-left);padding-right:env(safe-area-inset-right)}

/* ---- UX pass: mobile-first ---- */
html{-webkit-text-size-adjust:100%}
body{-webkit-tap-highlight-color:transparent}
input,select,textarea{font-size:16px;min-height:44px;border-radius:8px}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--acc);box-shadow:0 0 0 3px var(--ring)}
button{min-height:40px;border-radius:8px}
button.sm{min-height:32px}
button:disabled{opacity:.35;cursor:default}
button:active{transform:scale(.98)}
input[type=checkbox]{accent-color:var(--acc);width:22px!important;height:22px;min-height:0;flex:none}
.chk{padding:.45rem 0;font-size:1rem;gap:.7rem;cursor:pointer}
header{position:sticky;top:0;z-index:20;background:var(--glass);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);padding-top:calc(.7rem + env(safe-area-inset-top));padding-bottom:.7rem}
header .tools{display:flex;align-items:center;gap:.3rem}
header .tools button{margin:0;min-height:34px;padding:.3rem .65rem;font-size:.8rem}
#saved{font-size:.75rem;color:var(--ok);opacity:0;transition:opacity .4s;margin-right:.4rem}
#saved.show{opacity:1}
.stepper{margin:.2rem 0 1rem}
.stepper .meta{display:flex;justify-content:space-between;align-items:baseline;font-size:.8rem;color:var(--mute);margin-bottom:.4rem}
.stepper .meta b{color:var(--text);font-size:.95rem}
.bar{height:4px;background:var(--line);border-radius:4px;overflow:hidden;margin-bottom:.6rem}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--acc),var(--acc2));transition:width .3s}
.steps{flex-wrap:nowrap;overflow-x:auto;scroll-snap-type:x proximity;scrollbar-width:none;margin:0 -1rem;padding:0 1rem .2rem}
.steps::-webkit-scrollbar{display:none}
.steps button{flex:none;scroll-snap-align:center;min-height:34px;white-space:nowrap}
.steps button.done::after{content:" ✓"}
.steps button.on{background:var(--accbg)}
.card{border-radius:14px;padding:1.3rem 1.1rem}
.card h2{font-size:1.4rem;letter-spacing:-.01em;line-height:1.2}
.item{background:var(--card2);border-radius:12px;padding:.8rem .9rem .9rem}
.item .x{min-height:30px;min-width:30px;padding:0;background:transparent;border-color:transparent;color:var(--mute)}
.empty{border:1.5px dashed var(--line);border-radius:12px;padding:1.4rem;text-align:center;color:var(--mute);margin:.6rem 0}
.addrow{display:flex;gap:.5rem;flex-wrap:wrap;margin-top:.6rem}
.addrow button{flex:1;min-width:140px;border-style:dashed}
.chips{display:flex;gap:.4rem;overflow-x:auto;scrollbar-width:none;padding:.2rem 0}
.chips::-webkit-scrollbar{display:none}
.chips button{flex:none;border-radius:999px;font-size:.82rem;min-height:34px}
main{padding-bottom:calc(90px + env(safe-area-inset-bottom))}
.navbar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--glass);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--line);padding:.7rem 1rem calc(.7rem + env(safe-area-inset-bottom))}
.navbar .in{max-width:1100px;margin:0 auto;display:flex;gap:.6rem}
.navbar button{min-height:48px;font-size:1rem}
.navbar .back{flex:0 0 auto;padding:0 1.1rem}
.navbar .pri{flex:1}
.view-enter{animation:fade .22s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.view-enter{animation:none}}
@media (max-width:600px){
  header{flex-wrap:nowrap;gap:.5rem;padding-left:.9rem;padding-right:.9rem}
  header h1{font-size:.95rem;white-space:nowrap}
  #saved{display:none}
  .tools .lbl{display:none}
  main{padding-left:.8rem;padding-right:.8rem}
  .grid{grid-template-columns:1fr 1fr}
  .grid>div:has(textarea){grid-column:1/-1}
  table{font-size:.82rem}
}
.hint{display:none;font-size:.78rem;color:var(--mute);margin:.3rem 0 0}
.bom select{min-height:36px;font-size:15px;margin:.3rem 0 .1rem}
@media (max-width:600px){
  .hint{display:block}
  .bom,.bom tbody{display:block}
  .bom tr.hd{display:none}
  .bom tr{display:grid;grid-template-columns:1fr auto;gap:0 .6rem;background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:.7rem .8rem;margin:.5rem 0}
  .bom td{border:0;padding:0}
  .bom .cat{grid-column:1/-1;font-size:.7rem;text-transform:uppercase;letter-spacing:.08em;color:var(--acc2)}
  .bom .itm{grid-column:1}
  .bom .qty{grid-column:2;grid-row:2;align-self:start;font-weight:700;font-size:1.05rem}
  .bom .nt{grid-column:1/-1;font-size:.8rem;color:var(--mute);padding-top:.2rem}
  .bom .nt:empty{display:none}
}
@media print{.navbar,.stepper{display:none!important}header{position:static}}
</style>
<script src="themes.js"></script>
</head>

<header>

  <div class="tools">

<main>

<div class="navbar noprint"><div class="in" id="navbar"></div></div>

// AEC channel capacity by DSP model ("sw" = software AEC that scales with the platform/licensing)
const AEC_CAP = {"TesiraFORTÉ X 400":4,"TesiraFORTÉ X 800":8,"IntelliMix P300":8,"Core Nano":"sw","Core 8 Flex":"sw"};
const ECOS = {auto:"Best fit",crestron:"Crestron",extron:"Extron",qsys:"Q-SYS",atlona:"Atlona"};

const blank = () => ({
  project:{name:"",client:"",roomType:"Conference room",length:"",width:"",seats:"",notes:""},
  displays:[], sources:[], routes:{},
  routing:{mode:"auto",preview:false},
  audio:{program:true,speech:false,mics:[],speakers:"Ceiling",speakerCount:"",dsp:"auto",aec:"auto",assist:false},

  infra:{maxRun:"",rackLoc:"Credenza",network:"Shared corporate",power:"",notes:"",eco:"auto"},

let S = load() || blank();
let step = 0;
window.onThemeChange = () => { if(document.getElementById("view")) render(); };

function load(){ try{ return JSON.parse(localStorage.getItem("avsketch")); }catch(e){ return null; } }
let savedT;
function save(){ try{ localStorage.setItem("avsketch", JSON.stringify(S)); const el=document.getElementById("saved"); if(el){ el.classList.add("show"); clearTimeout(savedT); savedT=setTimeout(()=>el.classList.remove("show"),1200);} }catch(e){} }
const uid = () => Math.random().toString(36).slice(2,8);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const opts = (arr, v) => arr.map(o => `<option ${o==v?"selected":""}>${esc(o)}</option>`).join("");

// Bind helper: data-k="path.to.value"
function setPath(path, val){
  const keys = path.split("."); let o = S;
  for(let i=0;i<keys.length-1;i++) o = o[keys[i]];
  o[keys.at(-1)] = val; save();
}
document.addEventListener("input", e => {
  const k = e.target.dataset.k; if(!k) return;
  const v = e.target.type==="checkbox" ? e.target.checked : (e.target.type==="number" ? +e.target.value : e.target.value);
  setPath(k, v);
  if(e.target.dataset.rerender) render();
});
document.addEventListener("change", e => { if(e.target.dataset.rerender) render(); });

function field(label, k, val, type="text", extra=""){
  const im = type==="number" ? 'inputmode="decimal"' : "";
  return `<div><label>${label}</label><input type="${type}" ${im} data-k="${k}" value="${esc(val)}" ${extra}></div>`;
}
function sel(label, k, arr, val, rr=false){
  return `<div><label>${label}</label><select data-k="${k}" ${rr?'data-rerender="1"':""}>${opts(arr,val)}</select></div>`;
}
function chk(label, k, val, rr=false){
  return `<label class="chk"><input type="checkbox" data-k="${k}" ${val?"checked":""} ${rr?'data-rerender="1"':""}> ${label}</label>`;
}

// ---------- Steps ----------
const V = {
Project(){
  const p=S.project;
  return `<h2>Start with the space</h2><p class="q">What kind of room is this, and who's using it?</p>
  <div class="grid">${field("Project name","project.name",p.name)}${field("Client / end user","project.client",p.client)}
  ${sel("Room type","project.roomType",ROOM_TYPES,p.roomType)}${field("Seats / occupancy","project.seats",p.seats,"number")}
  ${field("Room length (ft)","project.length",p.length,"number")}${field("Room width (ft)","project.width",p.width,"number")}</div>
  <label>What does the room need to do? (use cases, pain points)</label><textarea data-k="project.notes">${esc(p.notes)}</textarea>`;
},
Displays(){
  const list = S.displays.map((d,i)=>`<div class="item"><button class="sm x" onclick="del('displays',${i})">✕</button>
   <div class="grid">${field("Name","displays."+i+".name",d.name)}${sel("Type","displays."+i+".type",DISPLAY_TYPES,d.type)}
   ${field("Size (in)","displays."+i+".size",d.size,"number")}${sel("Resolution","displays."+i+".res",["1080p","4K","Native LED","Other"],d.res)}
   ${field("Location","displays."+i+".loc",d.loc)}${field("Cable distance from rack (ft)","displays."+i+".dist",d.dist,"number")}</div></div>`).join("");
  const rec = sizeHint();
  return `<h2>How many displays are we trying to get to?</h2><p class="q">Add every screen in the design — main displays, confidence monitors, signage, overflow.</p>
  ${list || '<div class="empty">No displays yet — add the first screen this system needs to reach.</div>'}
  <div class="addrow"><button onclick="addDisplay()">＋ Add display</button><button onclick="addDisplay(2)">＋ Add 2</button></div>
  ${rec?`<div class="note">${rec}</div>`:""}`;
},
Sources(){
  const list = S.sources.map((s,i)=>`<div class="item"><button class="sm x" onclick="del('sources',${i})">✕</button>
   <div class="grid">${field("Name","sources."+i+".name",s.name)}${sel("Type","sources."+i+".type",SOURCE_TYPES,s.type)}
   ${sel("Location","sources."+i+".loc",LOCS,s.loc)}${chk("Carries audio","sources."+i+".audio",s.audio)}</div></div>`).join("");
  return `<h2>What are we trying to get to them?</h2><p class="q">List every source that needs to be seen — and where it plugs in.</p>
  ${list || '<div class="empty">No sources yet — tap a common one below to start.</div>'}
  <label>Quick add</label><div class="chips noprint">${SOURCE_TYPES.map(t=>`<button onclick="addSource('${t}')">＋ ${t.split(" (")[0]}</button>`).join("")}</div>
  <div class="addrow"><button onclick="addSource()">＋ Add custom source</button></div>`;
},
Routing(){
  if(!S.displays.length || !S.sources.length) return `<h2>Routing</h2><div class="note warn">Add at least one display and one source first.</div>`;
  const head = S.displays.map(d=>`<th class="c">${esc(d.name)}</th>`).join("");
  const rows = S.sources.map(s=>`<tr><td>${esc(s.name)}</td>${S.displays.map(d=>{
    const on = S.routes[s.id+"|"+d.id];
    return `<td class="c"><input type="checkbox" ${on?"checked":""} onchange="toggleRoute('${s.id}','${d.id}',this.checked)" style="width:auto"></td>`}).join("")}</tr>`).join("");
  const core = recommendCore();
  return `<h2>What needs to go where?</h2><p class="q">Check each source that should be viewable on each display.</p>
  <div class="noprint" style="margin-bottom:.5rem"><button class="sm" onclick="routeAll(true)">Any source → any display</button> <button class="sm" onclick="routeAll(false)">Clear</button></div>
  <div style="overflow-x:auto"><table><tr><th>Source ↓ / Display →</th>${head}</tr>${rows}</table></div>
  <div class="grid">${sel("Switching approach","routing.mode",["auto","Direct connection","Presentation switcher","Matrix switcher","AV over IP"],S.routing.mode,true)}</div>
  ${chk("Need different content on different displays at the same time","routing.independent",S.routing.independent,true)}
  <div class="note"><b>Suggested core:</b> ${core.name}<br>${core.why}</div>`;
},
Audio(){
  const a=S.audio;
  const mics = a.mics.map((m,i)=>`<div class="item"><button class="sm x" onclick="del('audio.mics',${i})">✕</button><div class="grid">
   ${sel("Mic type","audio.mics."+i+".type",["Ceiling array","Table boundary","Gooseneck","Wireless handheld","Wireless lav","Wireless headset"],m.type)}
   ${field("Qty","audio.mics."+i+".qty",m.qty,"number")}</div></div>`).join("");
  return `<h2>What do people need to hear?</h2><p class="q">Program audio from sources, voices in the room, and the far end.</p>
  ${chk("Program audio (play source audio in the room)","audio.program",a.program)}
  ${chk("Speech reinforcement (amplify presenters)","audio.speech",a.speech)}
  ${chk("Assistive listening required","audio.assist",a.assist)}
  <div class="grid">${sel("Speaker type","audio.speakers",["Ceiling","Wall-mount","Soundbar","Display speakers only","Line array / PA"],a.speakers)}
  ${field("Speaker qty","audio.speakerCount",a.speakerCount,"number")}
  ${sel("DSP","audio.dsp",["auto","Not needed","Small fixed DSP","Open-architecture DSP","Built into codec/bar"],a.dsp,true)}
  ${sel("Echo cancellation (AEC)","audio.aec",["auto","Required","Not needed"],a.aec||"auto",true)}</div>
  <div class="note">${aecSummary()}</div>
  <h3 style="font-size:1rem;margin:1rem 0 .2rem">Microphones</h3>${mics||'<div class="empty">No microphones. Add some if people in the room need to be heard (conferencing or reinforcement).</div>'}
  <div class="addrow"><button onclick="S.audio.mics.push({type:'Ceiling array',qty:1});save();render()">＋ Add microphones</button></div>
  ${a.speakerCount==="" && S.project.length && S.project.width ? `<div class="note">Rough ceiling speaker count for ${S.project.length}×${S.project.width} ft at ~9 ft ceiling: <b>${Math.max(2,Math.ceil(S.project.length*S.project.width/150))}</b></div>`:""}`;
},
Conferencing(){
  const c=S.conf;
  return `<h2>Does the far end need to see and hear us?</h2><p class="q">Video conferencing and remote participation.</p>
  <div class="grid">${sel("Platform","conf.platform",["None","Microsoft Teams Room","Zoom Room","Google Meet","BYOD (laptop drives the call)","Hybrid (native + BYOD)","Codec / SIP"],c.platform,true)}
  ${field("Cameras","conf.cameras",c.cameras,"number")}
  ${sel("Camera type","conf.cameraType",["PTZ","Fixed wide","Video bar (integrated)","Intelligent / multi-lens"],c.cameraType)}</div>
  ${chk("Auto-tracking / speaker framing","conf.tracking",c.tracking)}
  ${chk("USB bridge so laptops can use room camera/mics","conf.usbBridge",c.usbBridge)}
  ${c.platform!=="None" && !S.audio.mics.length ? `<div class="note warn">Conferencing is on but no microphones are listed — add them on the Audio step.</div>`:""}`;
},
Control(){
  const c=S.control;
  return `<h2>How will people run the room?</h2><p class="q">User interface and what it controls.</p>
  <div class="grid">${sel("Interface","control.type",["Touch panel","Button keypad","Platform console (Teams/Zoom)","Auto-switching only","Mobile / web UI","None"],c.type)}
  ${field("Qty","control.panels",c.panels,"number")}</div>
  ${chk("Room scheduling panel at door","control.scheduler",c.scheduler)}
  ${chk("Lighting integration","control.lighting",c.lighting)}
  ${chk("Shade integration","control.shades",c.shades)}
  ${chk("Occupancy-based power on/off","control.occupancy",c.occupancy)}
  <label>Control notes (presets, one-touch modes, etc.)</label><textarea data-k="control.notes">${esc(c.notes)}</textarea>`;
},
Infrastructure(){
  const f=S.infra;
  return `<h2>Where does it all live?</h2><p class="q">Rack, cabling, network and power.</p>
  <div class="grid">${sel("Equipment location","infra.rackLoc",["Credenza","Behind display","Wall rack","Floor rack in room","Closet / IDF","Lectern"],f.rackLoc)}
  ${sel("Network","infra.network",["Shared corporate","Dedicated AV VLAN","Isolated AV network","Unknown"],f.network)}
  ${field("Power / circuits","infra.power",f.power)}
  <div><label>Preferred ecosystem</label><select data-k="infra.eco">${Object.entries(ECOS).map(([k,v])=>`<option value="${k}" ${f.eco==k?"selected":""}>${v}</option>`).join("")}</select></div></div>
  <label>Notes (conduit, floor boxes, furniture, constraints)</label><textarea data-k="infra.notes">${esc(f.notes)}</textarea>
  ${checks().map(n=>`<div class="note warn">${n}</div>`).join("")}`;
},
Sketch(){
  const core = recommendCore();
  return `<h2>${esc(S.project.name||"Untitled design")} <span class="tag">${esc(S.project.roomType)}</span></h2>
  <p class="q">${[esc(S.project.client), S.project.seats?S.project.seats+" seats":""].filter(Boolean).join(" · ")}</p>
  <div class="diagram">${diagram()}</div><div class="hint noprint">Swipe the diagram sideways to see all of it →</div>
  <h3 style="font-size:1rem">Equipment sketch</h3>${bom()}
  <h3 style="font-size:1rem">Open items</h3>${(checks().map(n=>`<div class="note warn">${n}</div>`).join(""))||'<div class="note">No open flags.</div>'}
  <div class="noprint" style="margin-top:1rem"><button class="pri" onclick="savePDF(this)">Save PDF</button> <button onclick="exportDrawio()">Download .drawio</button> <button onclick="downloadSVG()">Download SVG</button></div>`;
}};

// ---------- Logic ----------
function addDisplay(n=1){ for(let i=0;i<n;i++){ const k=S.displays.length+1; S.displays.push({id:uid(),name:"Display "+k,type:"Flat panel",size:"",res:"4K",loc:"",dist:""}); } save(); render(); }
function addSource(t="Laptop (HDMI/USB-C)"){ const k=S.sources.length+1; S.sources.push({id:uid(),name:t.split(" (")[0]+" "+k,type:t,loc:t.includes("PC")||t.includes("IPTV")||t.includes("player")?"Equipment rack":"Table",audio:true}); save(); render(); }
function del(path,i){ const keys=path.split("."); let o=S; keys.forEach(k=>o=o[k]); o.splice(i,1); save(); render(); }
function toggleRoute(s,d,v){ S.routes[s+"|"+d]=v; save(); render(); }
function routeAll(v){ S.sources.forEach(s=>S.displays.forEach(d=>S.routes[s.id+"|"+d.id]=v)); save(); render(); }
const routed = () => Object.entries(S.routes).filter(([k,v])=>v).map(([k])=>k.split("|"));

function sizeHint(){
  const L=+S.project.length; if(!L) return "";
  // AVIXA-ish rough: farthest viewer ≈ 0.8×length; basic decision image height ≈ distance/6 → diagonal ≈ h/0.49
  const far=L*0.85, h=far/6*12, diag=Math.round(h/0.49);
  return `For a ~${L} ft deep room, a main display around <b>${diag}"</b> diagonal (16:9) is a reasonable starting point for general viewing. Verify against the AVIXA DISCAS standard for detailed content.`;
}
function recommendCore(){
  const nS=S.sources.length, nD=S.displays.length, maxDist=Math.max(0,...S.displays.map(d=>+d.dist||0));
  const multi = S.routing.independent;
  let name, why;
  if(S.routing.mode!=="auto"){ name=S.routing.mode; why="Selected manually."; }
  else if(nD>8 || S.project.roomType==="Multi-room / campus" || maxDist>330){ name="AV over IP"; why=`${nD} displays${maxDist>330?" and runs over 330 ft":""} — a networked encoder/decoder system scales better than a fixed matrix.`; }
  else if(nS<=1 && nD<=1){ name="Direct connection"; why="One source to one display — no switcher needed (consider a wall plate/extender if the run is long)."; }
  else if(nD<=2 && !multi){ name="Presentation switcher"; why="A few sources to one or two displays showing the same thing — a presentation switcher/scaler with built-in extenders fits."; }
  else { name=`Matrix switcher (${Math.max(4,nextSize(nS))}×${Math.max(2,nextSize(nD))})`; why="Multiple displays with independent content — a matrix lets any source go to any display."; }
  return {name,why};
}
function nextSize(n){ return [2,4,6,8,10,12,16,24,32].find(x=>x>=n)||n; }
function transport(dist){ dist=+dist||0; if(!dist) return "?"; if(dist<=25) return "HDMI"; if(dist<=330) return "HDBaseT"; return "Fiber / AVoIP"; }

function checks(){
  const n=[];
  if(!S.displays.length) n.push("No displays defined.");
  if(!S.sources.length) n.push("No sources defined.");
  S.displays.forEach(d=>{ if(!routed().some(r=>r[1]===d.id)) n.push(`${esc(d.name)} has no sources routed to it.`); if(!d.dist) n.push(`${esc(d.name)}: cable distance unknown — needed to pick HDMI vs HDBaseT vs fiber.`); });
  S.sources.forEach(s=>{ if(!routed().some(r=>r[0]===s.id)) n.push(`${esc(s.name)} isn't routed anywhere.`); });
  if(S.conf.platform!=="None" && !S.conf.cameras && S.conf.cameraType!=="Video bar (integrated)") n.push("Conferencing selected but no cameras.");
  if(S.audio.speech && S.audio.mics.some(m=>m.type==="Ceiling array")) n.push("Speech reinforcement with ceiling mics is prone to feedback — review gain-before-feedback.");
  if(aecOn()){
    const dsp=needsDSP(), dItem=items().find(i=>i.key==="dsp");
    if(!dsp && S.conf.cameraType!=="Video bar (integrated)") n.push("AEC is required but DSP is set to Not needed — the far end will hear echo.");
    if(dItem){ const m=pickOf(dItem)[1], cap=AEC_CAP[m], ch=aecChannels();
      if(cap===undefined) n.push(`${esc(m)}: AEC capacity not listed — confirm it supports ${ch} AEC channel(s).`);
      else if(cap!=="sw" && ch>cap) n.push(`${esc(m)} has ${cap} AEC channels but ${ch} are needed — step up a model or reduce mic channels.`);
      else if(cap==="sw") n.push(`${esc(m)}: confirm Q-SYS AEC licensing covers ${ch} channel(s).`); }
    if(!S.audio.mics.length) n.push("AEC is on but no microphones are listed.");
  }
  if(S.audio.assist) n.push("Assistive listening: confirm ADA receiver quantity for occupancy.");
  if(S.infra.network==="Unknown") n.push("Network approach not confirmed with IT.");
  return n;
}
function aecOn(){ const v=S.audio.aec||"auto"; return v==="Required" || (v==="auto" && S.conf.platform!=="None"); }
// 1 AEC channel per discrete mic; arrays counted as 1 per unit (automixed output)
function aecChannels(){ return S.audio.mics.reduce((n,m)=>n+(+m.qty||1),0); }
function aecSummary(){
  const v=S.audio.aec||"auto";
  if(!aecOn()) return v==="Not needed" ? "AEC off. Fine for presentation-only or reinforcement rooms with no far end." : "AEC off: no conferencing selected. Set to <b>Required</b> if any far-end audio (calls, streaming, remote presenters) touches this room.";
  const ch=aecChannels(), why=v==="auto"?" (auto: conferencing is on)":"";
  return `AEC on${why}. <b>${ch||"0"} AEC channel${ch===1?"":"s"}</b> needed: one per mic channel, counting each array as one automixed channel.${S.conf.cameraType==="Video bar (integrated)"?" The video bar's built-in AEC covers its own mics; external mics still need DSP AEC.":""}`;
}
function needsDSP(){
  const a=S.audio; if(a.dsp!=="auto") return a.dsp==="Not needed"?null:a.dsp;
  if(aecOn() && a.mics.length) return "Open-architecture DSP";
  if(a.mics.length || a.speech) return S.conf.cameraType==="Video bar (integrated)"?"Built into codec/bar":"Open-architecture DSP";
  if(a.program && (+a.speakerCount>0 || a.speakers!=="Display speakers only")) return "Small fixed DSP";
  return null;
}

// Build structured equipment list: {key, cat, role, catKey, qty, note}
function items(){
  const L=[], add=(key,cat,role,catKey,qty,note="")=>{ if(qty>0||qty==="TBD") L.push({key,cat,role,catKey,qty,note}); };
  const core=recommendCore().name, avoip=core.startsWith("AV over IP");
  const routedSrc=S.sources.filter(s=>routed().some(r=>r[0]===s.id));
  const routedDsp=S.displays.filter(d=>routed().some(r=>r[1]===d.id));
  // Displays
  const dmap={"Flat panel":"panel","Confidence monitor":"panel","Projector + screen":"projector","LED video wall":"led","Interactive display":"interactive"};
  const byT={}; S.displays.forEach(d=>{const k=dmap[d.type]; byT[k]=byT[k]||{n:0,sz:new Set()}; byT[k].n++; if(d.size) byT[k].sz.add(d.size+'"');});
  Object.entries(byT).forEach(([k,v])=>add("disp_"+k,"Display",k==="projector"?"Projector + screen":k==="led"?"LED wall":k==="interactive"?"Interactive display":"Flat panel",k,v.n,[...v.sz].join(", ")));
  // Switching / transport
  if(avoip){
    add("enc","Video","AVoIP encoder","avoip_enc",routedSrc.filter(s=>s.type!=="Wireless presentation"||true).length,"1 per source (or per input location)");
    add("dec","Video","AVoIP decoder","avoip_dec",routedDsp.length,"1 per display");
    add("netsw","Network","AV network switch","avoip_switch",1,`1 GbE, IGMP snooping + querier, ${routedSrc.length+routedDsp.length+4}+ PoE ports`);
  } else {
    if(core.startsWith("Presentation")) add("core","Video","Presentation switcher","pres_sw",1,`${S.sources.length} in / ${S.displays.length} out`);
    if(core.startsWith("Matrix")) add("core","Video","Matrix switcher","matrix",1,core.replace("Matrix switcher ",""));
    const longD=S.displays.filter(d=>transport(d.dist)==="HDBaseT").length;
    const swHasHDBT=core.startsWith("Presentation");
    if(longD){ if(!swHasHDBT) add("hdtx","Video","HDBaseT transmitter","hdbt_tx",longD,"display side"); add("hdrx","Video","HDBaseT receiver","hdbt_rx",longD,"at displays over 25 ft"); }
    const remote=S.sources.filter(s=>["Table","Lectern","Wall plate"].includes(s.loc)).length;
    if(remote && S.infra.rackLoc!=="Credenza") add("srctx","Video","HDBaseT transmitter (input side)","hdbt_tx",remote,"table/wall inputs back to rack");
  }
  const tableIn=S.sources.filter(s=>s.loc==="Table").length; if(tableIn) add("tbox","Video","Table input box","tableinput",1,`${tableIn} connection(s)`);
  // Sources
  const smap={"Room PC":"pc","Media player":"player","Digital signage player":"player","Cable / IPTV":"iptv","Document camera":"doccam","Wireless presentation":"wireless"};
  const sc={}; S.sources.forEach(s=>{const k=smap[s.type]; if(k) sc[k]=(sc[k]||0)+1;});
  Object.entries(sc).forEach(([k,q])=>add("src_"+k,"Source",{pc:"Room PC",player:"Media player",iptv:"IPTV / STB",doccam:"Document camera",wireless:"Wireless presentation"}[k],k,q));
  // Audio
  const a=S.audio, dsp=needsDSP();
  const aecNote=aecOn()?`AEC: ${aecChannels()} ch needed`:"No AEC";
  if(dsp==="Open-architecture DSP") add("dsp","Audio","DSP"+(aecOn()?" with AEC":""),"dsp_open",1,aecNote);
  else if(dsp==="Small fixed DSP") add("dsp","Audio","DSP"+(aecOn()?" with AEC":""),"dsp_small",1,aecNote);
  const mmap={"Ceiling array":"mic_ceiling","Table boundary":"mic_table","Gooseneck":"mic_goose","Wireless handheld":"mic_wireless","Wireless lav":"mic_wireless","Wireless headset":"mic_wireless"};
  a.mics.forEach((m,i)=>add("mic"+i,"Audio","Mic — "+m.type,mmap[m.type],+m.qty||1));
  const spkMap={"Ceiling":"spk_ceiling","Wall-mount":"spk_wall","Line array / PA":"spk_line"};
  const nSpk=+a.speakerCount || (S.project.length&&S.project.width?Math.max(2,Math.ceil(S.project.length*S.project.width/150)):0);
  if(spkMap[a.speakers]){
    add("spk","Audio",a.speakers+" speakers",spkMap[a.speakers],nSpk||"TBD",a.speakerCount?"":"estimated from room size");
    const amp=ampSize(nSpk); add("amp","Audio","Amplifier","amp",amp.qty,amp.note);
  }
  if(a.assist) add("ald","Audio","Assistive listening","ald",1,"qty receivers per ADA occupancy table");
  // Conferencing
  const c=S.conf;
  if(c.platform!=="None" && !c.platform.startsWith("BYOD")){
    if(c.cameraType==="Video bar (integrated)" || (+S.project.seats||0)<=8) add("vc","Conferencing","Video bar / room kit","vc_teams",1,c.platform);
    else add("vc","Conferencing","Room compute + touch console","vc_compute",1,c.platform);
  }
  if(c.platform!=="None" && c.cameras && c.cameraType!=="Video bar (integrated)") add("cam","Conferencing","Camera"+(c.tracking?" (tracking)":""),"cam_ptz",+c.cameras);
  if(c.usbBridge || c.platform.startsWith("BYOD") || c.platform.startsWith("Hybrid")) add("usb","Conferencing","BYOD / USB bridge","usb_bridge",1);
  // Control
  const t=S.control.type;
  if(t==="Touch panel") add("tp","Control","Touch panel","touch",+S.control.panels||1);
  if(t==="Button keypad") add("kp","Control","Keypad","keypad",+S.control.panels||1);
  if(["Touch panel","Button keypad","Mobile / web UI"].includes(t)) add("proc","Control","Control processor","processor",1);
  if(S.control.scheduler) add("sched","Control","Scheduling panel","scheduler",1);
  if(S.control.occupancy) add("occ","Control","Occupancy sensor","occupancy",1);
  if(!avoip && L.some(i=>["dsp","proc","vc","tp","kp","sched","cam","src_wireless"].includes(i.key)))
    add("netsw","Network","Network switch (control / Dante / VC)","avoip_switch",1,"PoE+, AV VLAN; IGMP if Dante/AES67");
  add("rack","Infrastructure",S.infra.rackLoc+" rack / power","rack",1,S.infra.network);
  return L;
}
function ampSize(n){
  if(!n) return {qty:1,note:"size once speaker count is known"};
  const tap=S.audio.speakers==="Line array / PA"?60:15, need=Math.ceil(n*tap*1.25);
  if(n<=4 && S.audio.speakers!=="Line array / PA") return {qty:1,note:`${n} spkrs — low-Z possible; or 70 V @ ${tap} W taps ≈ ${need} W`};
  return {qty:Math.max(1,Math.ceil(need/300)),note:`70 V: ${n} × ${tap} W taps × 1.25 headroom ≈ ${need} W`};
}
function choices(catKey){
  const eco=S.infra.eco||"auto", list=CAT[catKey]||[];
  if(eco==="auto") return list;
  const pref=list.filter(p=>p[3]===eco), rest=list.filter(p=>p[3]!==eco);
  return [...pref,...rest];
}
function aecCapText(model){ const c=AEC_CAP[model]; return c==="sw"?"software AEC (scales with licensing)":c?c+"-ch AEC":"no AEC listed"; }
function pickOf(it){ const ch=choices(it.catKey); const saved=S.picks[it.key]; return ch.find(p=>p[0]+" "+p[1]===saved)||ch[0]; }
function setPick(k,v){ S.picks[k]=v; save(); render(); }

function bom(){
  const rows=items().map(it=>{
    const ch=choices(it.catKey), p=pickOf(it);
    const sel=ch.length?`<select class="noprint-sel" onchange="setPick('${it.key}',this.value)">${ch.map(c=>{const v=c[0]+" "+c[1];return `<option ${p&&v===p[0]+" "+p[1]?"selected":""}>${esc(v)}</option>`}).join("")}</select>`:"";
    return `<tr><td class="cat">${it.cat}</td><td class="itm"><b>${esc(it.role)}</b><br>${sel}<div class="q" style="margin:0;font-size:.78rem">${p?esc(p[2]):""}${p&&it.key==="dsp"?" · <b>"+aecCapText(p[1])+"</b>":""}</div></td><td class="c qty">×${it.qty}</td><td class="nt">${esc(it.note)}</td></tr>`;
  }).join("");
  return `<div class="noprint" style="margin-bottom:.4rem;font-size:.85rem;color:var(--mute)">Ecosystem: <select style="width:auto" onchange="S.infra.eco=this.value;save();render()">${Object.entries(ECOS).map(([k,v])=>`<option value="${k}" ${S.infra.eco==k?"selected":""}>${v}</option>`).join("")}</select> · pick a model on any line</div>
  <div style="overflow-x:auto"><table class="bom"><tr class="hd"><th>Category</th><th>Item / model</th><th class="c">Qty</th><th>Notes</th></tr>${rows}</table></div>
  <div class="noprint" style="margin-top:.5rem"><button onclick="exportCSV()">Download BOM (CSV)</button></div>
  <p class="q" style="font-size:.78rem">Models are starting points — confirm current part numbers, compatibility and lead times with your distributor.</p>`;
}
function exportCSV(){
  const q=s=>`"${String(s??"").replace(/"/g,'""')}"`;
  const lines=[["Category","Role","Brand","Model","Description","Qty","Notes"].map(q).join(",")];
  items().forEach(it=>{const p=pickOf(it)||["","",""]; lines.push([it.cat,it.role,p[0],p[1],p[2],it.qty,it.note].map(q).join(","));});
  dl(new Blob([lines.join("\n")],{type:"text/csv"}),(S.project.name||"av-design")+"-bom.csv");
}

let LAST_LAYOUT=null;
function diagram(){
  const D=T(), IT=items(), has=k=>IT.find(i=>i.key===k);
  const model=k=>{ const i=has(k); if(!i) return ""; const p=pickOf(i); return p?p[0]+" "+p[1]:""; };
  const core=recommendCore().name, avoip=core.startsWith("AV over IP"), direct=core.startsWith("Direct");
  const bw=200, bh=42, gap=58, N={}, E=[], secs=[];
  const node=(id,col,y,title,sub,kind)=>{ N[id]={id,col,y,title,sub,kind}; return id; };
  const edge=(a,b,k,l)=>{ if(a&&b) E.push({a,b,k,l}); };
  const smap={"Room PC":"pc","Media player":"player","Digital signage player":"player","Cable / IPTV":"iptv","Document camera":"doccam","Wireless presentation":"wireless"};
  const dmap={"Flat panel":"panel","Confidence monitor":"panel","Projector + screen":"projector","LED video wall":"led","Interactive display":"interactive"};
  let y=62;

  // ---- VIDEO ----
  secs.push(["VIDEO",y-22]);
  const nS=S.sources.length, nD=S.displays.length, rows=Math.max(nS,nD,1), rowY=i=>y+i*gap;
  let coreId=null;
  if(!direct){
    const ck=avoip?"netsw":"core";
    const title=avoip?"AV network switch":core.startsWith("Matrix")?"Matrix switcher":"Presentation switcher";
    coreId=node("core",2,(rowY(0)+rowY(rows-1))/2,title,model(ck)||core,"core");
  }
  const srcEnd={};
  S.sources.forEach((s,i)=>{
    const k=smap[s.type], m=k?model("src_"+k):"";
    let sub=m||s.type.split(" (")[0]; if(s.loc==="Table" && has("tbox")) sub+=" · via "+pickOf(has("tbox"))[1];
    let last=node("s"+i,0,rowY(i),s.name,sub,"src");
    const r=routed().some(x=>x[0]===s.id);
    if(avoip && r){ const t=node("enc"+i,1,rowY(i),"Encoder",model("enc"),"ep"); edge(last,t,"video","HDMI"); last=t; }
    else if(!avoip && has("srctx") && ["Table","Lectern","Wall plate"].includes(s.loc)){ const t=node("tx"+i,1,rowY(i),"HDBaseT transmitter",model("srctx"),"ep"); edge(last,t,"video","HDMI"); last=t; }
    srcEnd[s.id]=last;
    if(coreId && r) edge(last,coreId,"video",avoip?"1 GbE":"");
  });
  S.displays.forEach((d,j)=>{
    const m=model("disp_"+dmap[d.type]);
    const id=node("d"+j,4,rowY(j),d.name+(d.size?` · ${d.size}"`:""),m||d.type,"dsp");
    const r=routed().some(x=>x[1]===d.id); let first=id;
    if(avoip && r){ first=node("dec"+j,3,rowY(j),"Decoder",model("dec"),"ep"); edge(first,id,"video","HDMI"); }
    else if(!avoip && transport(d.dist)==="HDBaseT" && has("hdrx")){ first=node("rx"+j,3,rowY(j),"HDBaseT receiver",model("hdrx"),"ep"); edge(first,id,"video","HDMI"); }
    if(coreId && r) edge(coreId,first,"video",avoip?"1 GbE":transport(d.dist)==="HDBaseT"?"HDBaseT":"HDMI");
    else if(direct) routed().filter(x=>x[1]===d.id).forEach(x=>edge(srcEnd[x[0]],first,"video",transport(d.dist)));
  });
  y=rowY(rows-1)+bh+70;

  // generic banded section: cols = array of 5 arrays of {id,title,sub,kind}
  const band=(label,cols)=>{
    const n=Math.max(...cols.map(c=>c.length)); if(!n) return false;
    secs.push([label,y-22]);
    cols.forEach((c,ci)=>c.forEach((o,k)=>node(o.id,ci,y+((n-c.length)/2+k)*gap,o.title,o.sub,o.kind)));
    y+= (n-1)*gap+bh+70; return true;
  };

  // ---- AUDIO & CONFERENCING ----
  const A=[[],[],[],[],[]];
  S.audio.mics.forEach((m,i)=>A[0].push({id:"mic"+i,title:`Mic ×${m.qty||1} · ${m.type}`,sub:model("mic"+i),kind:"aud"}));
  if(has("cam")) A[0].push({id:"cam",title:`Camera ×${has("cam").qty}`,sub:model("cam"),kind:"conf"});
  if(has("vc")) A[1].push({id:"vc",title:S.conf.platform.split(" (")[0],sub:model("vc"),kind:"conf"});
  if(has("usb")) A[1].push({id:"usb",title:"USB bridge",sub:model("usb"),kind:"conf"});
  if(has("dsp")) A[2].push({id:"dspx",title:aecOn()?`DSP · AEC ${aecChannels()} ch`:"DSP",sub:model("dsp"),kind:"aud"});
  if(has("amp")) A[3].push({id:"amp",title:`Amplifier ×${has("amp").qty}`,sub:model("amp"),kind:"aud"});
  if(has("spk")) A[4].push({id:"spk",title:`Speakers ×${has("spk").qty}`,sub:model("spk"),kind:"aud"});
  if(has("ald")) A[4].push({id:"ald",title:"Assistive listening",sub:model("ald"),kind:"aud"});
  band("AUDIO & CONFERENCING",A);
  const dspId=N.dspx?"dspx":null;
  S.audio.mics.forEach((m,i)=>edge("mic"+i,dspId||(N.vc?"vc":null),"audio",/Wireless/.test(m.type)?"RF rx":"Dante/analog"));
  if(N.cam) edge("cam",N.vc?"vc":N.usb?"usb":null,"usb","USB/IP");
  if(N.usb && dspId) edge("usb",dspId,"usb","USB audio");
  if(N.vc && dspId) edge("vc",dspId,"audio","USB/Dante");
  if(N.vc && coreId) edge("vc",coreId,"video","HDMI");
  if(dspId && coreId && S.audio.program) edge(coreId,dspId,"audio","program audio");
  if(dspId) edge(dspId,N.amp?"amp":N.spk?"spk":null,"audio","");
  if(N.amp) edge("amp","spk","audio",S.audio.speakers==="Line array / PA"?"low-Z":"70 V");
  if(dspId && N.ald) edge(dspId,"ald","audio","");

  // ---- CONTROL & NETWORK ----
  const C=[[],[],[],[],[]];
  if(has("tp")) C[0].push({id:"tp",title:`Touch panel ×${has("tp").qty}`,sub:model("tp"),kind:"ctl"});
  if(has("kp")) C[0].push({id:"kp",title:`Keypad ×${has("kp").qty}`,sub:model("kp"),kind:"ctl"});
  if(has("sched")) C[0].push({id:"sched",title:"Scheduling panel",sub:model("sched"),kind:"ctl"});
  if(has("occ")) C[1].push({id:"occ",title:"Occupancy sensor",sub:model("occ"),kind:"ctl"});
  if(has("proc")) C[2].push({id:"proc",title:"Control processor",sub:model("proc"),kind:"ctl"});
  if(has("netsw")) C[3].push({id:"net",title:avoip?"Network · control/Dante VLAN":"Network switch",sub:avoip?"same switch: "+model("netsw"):model("netsw"),kind:"net"});
  C[4].push({id:"rack",title:S.infra.rackLoc+" rack",sub:model("rack")+(S.infra.network?" · "+S.infra.network:""),kind:"ctl"});
  band("CONTROL & NETWORK",C);
  const netId=N.net?"net":null;
  ["tp","kp"].forEach(k=>edge(k,N.proc?"proc":null,"control",""));
  edge("occ",N.proc?"proc":null,"control","contact");
  if(N.proc){ if(coreId) edge("proc",coreId,"control","IP/RS-232"); if(dspId) edge("proc",dspId,"control","IP"); if(N.vc) edge("proc","vc","control","IP"); }
  if(netId) ["dspx","vc","proc","tp","sched","cam"].forEach(k=>{ if(N[k] && k!==netId) edge(k,netId,"net",""); });

  // ---- layout + draw ----
  const H=y-30, W=Math.max(1120, Math.ceil(H*1.6)), colX=c=>20+c*((W-40-bw)/4);
  Object.values(N).forEach(n=>n.x=colX(n.col));
  const ST={video:[D.acc,"",1.8],audio:[D.ok,"",1.8],control:[D.mute,"5 4",1.4],net:[D.acc2,"2 4",1.4],usb:[D.text,"7 3",1.2]};
  const KS={src:D.line,dsp:D.line,ep:D.acc,core:D.acc,aud:D.ok,conf:D.acc2,ctl:D.mute,net:D.acc2};
  let g=`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${W} ${H}" width="100%" style="min-width:760px;font-family:system-ui,sans-serif;font-size:12px"><rect width="${W}" height="${H}" fill="${D.field}"/>`;
  secs.forEach(([t,sy],i)=>{ if(i) g+=`<line x1="20" y1="${sy-18}" x2="${W-20}" y2="${sy-18}" stroke="${D.line}"/>`; g+=`<text x="20" y="${sy}" fill="${D.mute}" font-size="11" letter-spacing="1.5">${t}</text>`; });
  // legend
  const LG=[["Video","video"],["Audio","audio"],["Control","control"],["Network","net"],["USB","usb"]];
  LG.forEach(([t,k],i)=>{ const lx=W-20-(LG.length-i)*88, [c,da]=ST[k]; g+=`<line x1="${lx}" y1="16" x2="${lx+22}" y2="16" stroke="${c}" stroke-width="2" ${da?`stroke-dasharray="${da}"`:""}/><text x="${lx+27}" y="20" fill="${D.mute}" font-size="10">${t}</text>`; });
  E.forEach(e=>{
    const A1=N[e.a], B1=N[e.b]; if(!A1||!B1) return;
    const [c,da,w]=ST[e.k]; let x1,y1,x2,y2,p;
    if(A1.col===B1.col){
      const dn=A1.y<B1.y; x1=x2=A1.x+bw/2+(e.k==="video"?-30:e.k==="audio"?30:0);
      y1=dn?A1.y+bh:A1.y; y2=dn?B1.y:B1.y+bh; p=`M${x1} ${y1} L${x2} ${y2}`;
    } else {
      const fwd=A1.col<B1.col; x1=fwd?A1.x+bw:A1.x; x2=fwd?B1.x:B1.x+bw; y1=A1.y+bh/2; y2=B1.y+bh/2;
      const mx=(x1+x2)/2; p=`M${x1} ${y1} C ${mx} ${y1}, ${mx} ${y2}, ${x2} ${y2}`;
    }
    g+=`<path d="${p}" fill="none" stroke="${c}" stroke-width="${w}" ${da?`stroke-dasharray="${da}"`:""} opacity=".9"/>`;
    if(e.l) g+=`<text x="${(x1+x2)/2}" y="${(y1+y2)/2-4}" text-anchor="middle" fill="${c}" font-size="9.5" paint-order="stroke" stroke="${D.field}" stroke-width="3">${esc(e.l)}</text>`;
  });
  Object.values(N).forEach(n=>g+=box(n.x,n.y,bw,bh,n.title,n.sub,n.kind==="core"?D.accbg:D.panel,KS[n.kind]||D.line,n.kind==="core"));
  LAST_LAYOUT={N,E,W,H,secs,bw,bh};
  return g+"</svg>";
}
function box(x,y,w,h,t,sub,fill,stroke,bold){
  const D=T(), cut=(s,n)=>{s=String(s||"");return s.length>n?s.slice(0,n-1)+"…":s};
  return `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="6" fill="${fill}" stroke="${stroke}" stroke-width="${bold?2:1.2}"/>
  <text x="${x+10}" y="${y+(sub?17:h/2+4)}" fill="${D.text}" font-weight="600">${esc(cut(t,28))}</text>
  ${sub?`<text x="${x+10}" y="${y+33}" fill="${D.mute}" font-size="10.5">${esc(cut(sub,33))}</text>`:""}`;
}

// ---------- Render / IO ----------
function isDone(i){
  switch(STEPS[i]){
    case "Project": return !!(S.project.name||S.project.seats);
    case "Displays": return S.displays.length>0;
    case "Sources": return S.sources.length>0;
    case "Routing": return routed().length>0;
    default: return (S.visited||[]).includes(i);
  }
}
function render(animate){
  S.visited=S.visited||[];
  const last=STEPS.length-1;
  document.getElementById("meta").innerHTML=`<b>${STEPS[step]}</b><span>Step ${step+1} of ${STEPS.length}</span>`;
  document.getElementById("barfill").style.width=((step+1)/STEPS.length*100)+"%";
  const st=document.getElementById("steps");
  st.innerHTML = STEPS.map((s,i)=>`<button class="${i===step?"on":""} ${i!==step&&isDone(i)?"done":""}" onclick="go(${i})">${i+1}. ${s}</button>`).join("");
  const on=st.querySelector(".on"); if(on) st.scrollLeft = on.offsetLeft - st.clientWidth/2 + on.clientWidth/2;
  const y=window.scrollY;
  document.getElementById("view").innerHTML = `<div class="card ${animate?"view-enter":""}">${V[STEPS[step]]()}</div>`;
  if(!animate) window.scrollTo(0,y);
  document.getElementById("navbar").innerHTML =
    `<button class="back" onclick="go(${step-1})" ${step===0?"disabled":""} aria-label="Back">←</button>`+
    (step<last ? `<button class="pri" onclick="go(${step+1})">Next: ${STEPS[step+1]} →</button>`
               : `<button class="pri" onclick="savePDF(this)">Save PDF</button>`);
}
function go(i){ if(i<0||i>=STEPS.length) return; S.visited=[...new Set([...(S.visited||[]),step])]; save(); step=i; render(true); window.scrollTo(0,0); }
function exportJSON(){ dl(new Blob([JSON.stringify(S,null,2)],{type:"application/json"}),(S.project.name||"av-design")+".json"); }
function fileBase(){ return (S.project.name||"av-design").replace(/[^\w\- ]+/g,"").trim().replace(/\s+/g,"-")||"av-design"; }
async function shareOrDownload(blob,name){
  try{ const f=new File([blob],name,{type:blob.type}); if(navigator.canShare && navigator.canShare({files:[f]}) && matchMedia("(display-mode: standalone)").matches){ await navigator.share({files:[f],title:name}); return; } }catch(e){ if(e.name==="AbortError") return; }
  dl(blob,name);
}
function downloadSVG(){ shareOrDownload(new Blob([diagram()],{type:"image/svg+xml"}),fileBase()+".svg"); }

// ---------- draw.io export (editable: shapes + attached connectors, print-friendly colors) ----------
function exportDrawio(){
  diagram(); const L=LAST_LAYOUT; if(!L) return;
  const x=v=>String(v??"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
  const KS={src:"#5b6875",dsp:"#5b6875",ep:"#0a6cff",core:"#0a6cff",aud:"#15803d",conf:"#c96a00",ctl:"#5b6875",net:"#c96a00"};
  const ES={video:["#0a6cff",0,""],audio:["#15803d",0,""],control:["#5b6875",1,"6 4"],net:["#c96a00",1,"2 3"],usb:["#7c3aed",1,"8 3"]};
  const cells=['<mxCell id="0"/>','<mxCell id="1" parent="0"/>'];
  let n=0; const id=p=>p+(++n);
  // title + section labels
  cells.push(`<mxCell id="${id("t")}" value="${x("<b>"+(S.project.name||"Untitled design")+"</b> — signal flow")}" style="text;html=1;fontSize=18;align=left;verticalAlign=top;" vertex="1" parent="1"><mxGeometry x="20" y="-40" width="600" height="30" as="geometry"/></mxCell>`);
  L.secs.forEach(([t,sy],i)=>{
    if(i) cells.push(`<mxCell id="${id("sep")}" value="" style="endArrow=none;html=1;strokeColor=#d3dae2;" edge="1" parent="1"><mxGeometry relative="1" as="geometry"><mxPoint x="20" y="${sy-18}" as="sourcePoint"/><mxPoint x="${L.W-20}" y="${sy-18}" as="targetPoint"/></mxGeometry></mxCell>`);
    cells.push(`<mxCell id="${id("sec")}" value="${x(t)}" style="text;html=1;fontSize=11;fontColor=#5b6875;align=left;verticalAlign=bottom;" vertex="1" parent="1"><mxGeometry x="20" y="${sy-16}" width="300" height="20" as="geometry"/></mxCell>`);
  });
  // devices
  const vid={};
  Object.values(L.N).forEach(nd=>{
    vid[nd.id]="n_"+nd.id;
    const val=`<b>${x(nd.title)}</b>`+(nd.sub?`<br><font style="font-size:10px" color="#5b6875">${x(nd.sub)}</font>`:"");
    const st=`rounded=1;arcSize=12;whiteSpace=wrap;html=1;align=left;spacingLeft=8;fontSize=12;fillColor=${nd.kind==="core"?"#e8f2ff":"#ffffff"};strokeColor=${KS[nd.kind]||"#5b6875"};strokeWidth=${nd.kind==="core"?2:1.2};fontColor=#111820;`;
    cells.push(`<mxCell id="${vid[nd.id]}" value="${x(val)}" style="${st}" vertex="1" parent="1"><mxGeometry x="${Math.round(nd.x)}" y="${Math.round(nd.y)}" width="${L.bw}" height="${L.bh}" as="geometry"/></mxCell>`);
  });
  // connections, attached to devices so they follow when moved
  L.E.forEach(e=>{
    if(!vid[e.a]||!vid[e.b]) return;
    const [c,d,dp]=ES[e.k]||ES.video;
    const st=`edgeStyle=orthogonalEdgeStyle;rounded=1;html=1;endArrow=classic;endSize=5;strokeColor=${c};strokeWidth=1.5;fontColor=${c};fontSize=9;labelBackgroundColor=#ffffff;${d?`dashed=1;dashPattern=${dp};`:""}`;
    cells.push(`<mxCell id="${id("e")}" value="${x(e.l||"")}" style="${st}" edge="1" parent="1" source="${vid[e.a]}" target="${vid[e.b]}"><mxGeometry relative="1" as="geometry"/></mxCell>`);
  });
  // legend
  Object.entries({Video:"video",Audio:"audio",Control:"control",Network:"net",USB:"usb"}).forEach(([t,k],i)=>{
    const [c,d,dp]=ES[k], lx=L.W-20-(5-i)*95;
    cells.push(`<mxCell id="${id("lg")}" value="${t}" style="endArrow=none;html=1;strokeColor=${c};strokeWidth=2;fontSize=10;fontColor=#5b6875;labelPosition=right;align=left;${d?`dashed=1;dashPattern=${dp};`:""}" edge="1" parent="1"><mxGeometry relative="1" as="geometry"><mxPoint x="${lx}" y="16" as="sourcePoint"/><mxPoint x="${lx+24}" y="16" as="targetPoint"/><mxPoint x="14" y="0" as="offset"/></mxGeometry></mxCell>`);
  });
  const now=new Date().toISOString();
  const xml=`<?xml version="1.0" encoding="UTF-8"?>
<mxfile host="AV Design Sketch" modified="${now}" type="device">
  <diagram id="signal-flow" name="Signal Flow">
    <mxGraphModel dx="${L.W}" dy="${L.H}" grid="1" gridSize="10" guides="1" tooltips="1" connect="1" arrows="1" fold="1" page="1" pageScale="1" pageWidth="1700" pageHeight="1100" landscape="1" math="0" shadow="0" background="#ffffff">
      <root>
        ${cells.join("\n        ")}
      </root>
    </mxGraphModel>
  </diagram>
</mxfile>`;
  shareOrDownload(new Blob([xml],{type:"application/vnd.jgraph.mxfile"}),fileBase()+".drawio");
}
function dl(blob,name){ const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=name; a.rel="noopener"; document.body.appendChild(a); a.click(); setTimeout(()=>{URL.revokeObjectURL(a.href); a.remove();},4000); }

// ---------- PDF (built in-page; works in iOS home-screen mode where window.print() is unavailable) ----------
const PW=2200, PH=1700, PM=110, FONT="system-ui,-apple-system,Segoe UI,Roboto,sans-serif";
function loadImg(src){ return new Promise((res,rej)=>{ const i=new Image(); i.onload=()=>res(i); i.onerror=rej; i.src=src; }); }
function wrapText(x,text,maxW){
  const out=[]; String(text||"").split("\n").forEach(par=>{ let line=""; par.split(" ").forEach(w=>{ const t=line?line+" "+w:w; if(x.measureText(t).width>maxW && line){ out.push(line); line=w; } else line=t; }); out.push(line); });
  return out;
}
async function buildPDFBlob(){
  const pages=[];
  const newPage=()=>{ const c=document.createElement("canvas"); c.width=PW; c.height=PH; const x=c.getContext("2d"); x.fillStyle="#fff"; x.fillRect(0,0,PW,PH); x.textBaseline="top"; pages.push(c); return x; };
  const title=S.project.name||"Untitled design";
  const sub=[S.project.roomType,S.project.client,S.project.seats?S.project.seats+" seats":"",S.project.length&&S.project.width?S.project.length+"×"+S.project.width+" ft":""].filter(Boolean).join("  ·  ");
  const head=(x,label)=>{
    x.fillStyle="#0f1419"; x.font=`700 54px ${FONT}`; x.fillText(title,PM,PM);
    x.fillStyle="#555"; x.font=`28px ${FONT}`; x.fillText(sub,PM,PM+70);
    x.textAlign="right"; x.fillText(label+"   "+new Date().toLocaleDateString(),PW-PM,PM+14); x.textAlign="left";
    x.strokeStyle="#4fb3ff"; x.lineWidth=4; x.beginPath(); x.moveTo(PM,PM+120); x.lineTo(PW-PM,PM+120); x.stroke();
    return PM+150;
  };
  // Page 1: signal flow (landscape)
  let x=newPage(); let y=head(x,"SIGNAL FLOW");
  const img=await loadImg("data:image/svg+xml;charset=utf-8,"+encodeURIComponent(diagram()));
  const bw=PW-2*PM, bh=PH-y-PM-40, sc=Math.min(bw/img.width, bh/img.height);
  const iw=img.width*sc, ih=img.height*sc;
  x.drawImage(img,PM+(bw-iw)/2,y,iw,ih);
  // Equipment list
  x=newPage(); y=head(x,"EQUIPMENT LIST");
  const cols=[["Category",.13],["Item",.20],["Brand / model",.27],["Qty",.07],["Notes",.33]];
  const colX=[]; let cx0=PM; cols.forEach(([,w])=>{ colX.push(cx0); cx0+=w*(PW-2*PM); });
  const colW=cols.map(([,w])=>w*(PW-2*PM)-24);
  const header=()=>{ x.fillStyle="#f0f3f6"; x.fillRect(PM,y,PW-2*PM,52); x.fillStyle="#333"; x.font=`600 26px ${FONT}`; cols.forEach(([t],i)=>x.fillText(t,colX[i]+12,y+12)); y+=62; };
  header();
  items().forEach((it,n)=>{
    const p=pickOf(it)||["","",""];
    x.font=`26px ${FONT}`;
    const cells=[it.cat,it.role,(p[0]+" "+p[1]).trim()+(p[2]?"\n"+p[2]:""),String(it.qty),it.note];
    const lines=cells.map((c,i)=>wrapText(x,c,colW[i]));
    const rh=Math.max(...lines.map(l=>l.length))*34+20;
    if(y+rh>PH-PM-40){ x=newPage(); y=head(x,"EQUIPMENT LIST (cont.)"); header(); x.font=`26px ${FONT}`; }
    if(n%2){ x.fillStyle="#fafbfc"; x.fillRect(PM,y-6,PW-2*PM,rh); }
    lines.forEach((ls,i)=>ls.forEach((l,j)=>{ x.fillStyle=(i===2&&j>0)||i===4?"#666":"#111"; x.font=(i===2&&j===0)?`600 26px ${FONT}`:`26px ${FONT}`; x.fillText(l,colX[i]+12,y+4+j*34); }));
    y+=rh; x.strokeStyle="#e3e7eb"; x.lineWidth=2; x.beginPath(); x.moveTo(PM,y-6); x.lineTo(PW-PM,y-6); x.stroke();
  });
  // Open items
  const flags=checks().map(t=>t.replace(/&amp;/g,"&").replace(/&lt;/g,"<").replace(/&gt;/g,">").replace(/&quot;/g,'"'));
  if(flags.length){
    if(y+160>PH-PM){ x=newPage(); y=head(x,"OPEN ITEMS"); } else { y+=40; }
    x.fillStyle="#0f1419"; x.font=`700 34px ${FONT}`; x.fillText("Open items",PM,y); y+=56;
    x.font=`26px ${FONT}`;
    flags.forEach(f=>{ const ls=wrapText(x,f,PW-2*PM-40); if(y+ls.length*34>PH-PM-40){ x=newPage(); y=head(x,"OPEN ITEMS (cont.)"); x.font=`26px ${FONT}`; }
      x.fillStyle="#ffb454"; x.fillRect(PM,y+4,8,ls.length*34-8); x.fillStyle="#222"; ls.forEach((l,j)=>x.fillText(l,PM+30,y+j*34)); y+=ls.length*34+14; });
  }
  // Footers
  pages.forEach((c,i)=>{ const g=c.getContext("2d"); g.fillStyle="#999"; g.font=`22px ${FONT}`; g.textBaseline="top"; g.fillText("AV Design Sketch — sketch only; verify models and standards before quoting.",PM,PH-PM+30); g.textAlign="right"; g.fillText(`Page ${i+1} of ${pages.length}`,PW-PM,PH-PM+30); });
  // Assemble PDF: one full-page JPEG per landscape letter page (792×612 pt)
  const enc=new TextEncoder(), parts=[], off=[]; let len=0;
  const push=d=>{ const b=typeof d==="string"?enc.encode(d):d; parts.push(b); len+=b.length; };
  const obj=(n,fn)=>{ off[n]=len; push(`${n} 0 obj\n`); fn(); push("\nendobj\n"); };
  push(new Uint8Array([37,80,68,70,45,49,46,52,10,37,226,227,207,211,10]));
  const n=pages.length, kids=pages.map((_,i)=>`${3+i*3} 0 R`).join(" ");
  obj(1,()=>push("<< /Type /Catalog /Pages 2 0 R >>"));
  obj(2,()=>push(`<< /Type /Pages /Kids [${kids}] /Count ${n} >>`));
  pages.forEach((c,i)=>{
    const b64=c.toDataURL("image/jpeg",0.9).split(",")[1], bin=atob(b64), jpg=new Uint8Array(bin.length);
    for(let k=0;k<bin.length;k++) jpg[k]=bin.charCodeAt(k);
    const P=3+i*3, I=P+1, C=P+2, cs="q 792 0 0 612 0 0 cm /Im0 Do Q";
    obj(P,()=>push(`<< /Type /Page /Parent 2 0 R /MediaBox [0 0 792 612] /Resources << /XObject << /Im0 ${I} 0 R >> >> /Contents ${C} 0 R >>`));
    obj(I,()=>{ push(`<< /Type /XObject /Subtype /Image /Width ${PW} /Height ${PH} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${jpg.length} >>\nstream\n`); push(jpg); push("\nendstream"); });
    obj(C,()=>push(`<< /Length ${cs.length} >>\nstream\n${cs}\nendstream`));
  });
  const total=3+n*3, xref=len;
  push(`xref\n0 ${total}\n0000000000 65535 f \n`+off.slice(1).map(o=>String(o).padStart(10,"0")+" 00000 n \n").join(""));
  push(`trailer\n<< /Size ${total} /Root 1 0 R >>\nstartxref\n${xref}\n%%EOF\n`);
  return new Blob(parts,{type:"application/pdf"});
}
async function deliverPDF(blob){
  const name=(S.project.name||"av-design").replace(/[^\w\- ]+/g,"").trim().replace(/\s+/g,"-")+".pdf";
  const file=new File([blob],name,{type:"application/pdf"});
  if(navigator.canShare && navigator.canShare({files:[file]})){
    try{ await navigator.share({files:[file],title:name}); return true; }
    catch(e){ if(e.name==="AbortError") return true; if(e.name==="NotAllowedError") return file; }
  }
  dl(blob,name); return true;
}
async function savePDF(btn){
  const label=btn?btn.textContent:"";
  if(btn){ btn.disabled=true; btn.textContent="Building PDF…"; }
  try{
    const r=await deliverPDF(await buildPDFBlob());
    if(r instanceof File && btn){ // share needs a fresh tap after the async build
      btn.disabled=false; btn.textContent="PDF ready — tap to share";
      btn.onclick=async()=>{ try{ await navigator.share({files:[r],title:r.name}); }catch(e){} btn.textContent=label; btn.onclick=()=>savePDF(btn); };
      return;
    }
  }catch(e){ console.error(e); alert("Couldn't build the PDF: "+e.message); }
  if(btn){ btn.disabled=false; btn.textContent=label; }
}
function importJSON(e){ const f=e.target.files[0]; if(!f) return; f.text().then(t=>{ try{ S=Object.assign(blank(),JSON.parse(t)); save(); step=0; render(); }catch(err){ document.getElementById("view").insertAdjacentHTML("afterbegin",'<div class="note warn">Could not read that file.</div>'); } }); }
function resetAll(){ if(confirm("Start a new design? Unsaved work will be cleared (export first if you want it).")){ S=blank(); save(); step=0; render(); } }
render();
</script>
